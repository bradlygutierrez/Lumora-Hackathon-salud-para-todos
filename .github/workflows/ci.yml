name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        working-directory: Backend
        run: uv sync --frozen

      - name: Run tests
        working-directory: Backend
        run: uv run pytest
[project]
name = "lumora-api"
version = "0.1.0"
description = "This is a project created for Lumora an app created to help people with their medicine, appoiments and health"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pyotp>=2.10.0",
    "sqlalchemy>=2.0.52",
]

[tool.fastapi]
entrypoint = "lumora_api.main:app"

[project.scripts]
backend = "lumora_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

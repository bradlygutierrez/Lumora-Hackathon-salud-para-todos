[project]
name = "lumora-api"
version = "0.1.0"
description = "This is a project created for Lumora an app created to help people with their medicine, appoiments and health"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[tool.fastapi]
entrypoint = "lumora_api.main:app"

[project.scripts]
backend = "lumora_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
